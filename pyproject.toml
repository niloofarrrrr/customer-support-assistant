[project]
name = "customer-support-assistant"
version = "0.1.0"
description = "Human-reviewed AI customer support tickets with Streamlit and FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "google-genai>=2.31.0",
    "openai>=3.31.0",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.27.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_assistant"]